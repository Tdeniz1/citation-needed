name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (offline, recorded API responses)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest
      - name: CLI smoke test (offline)
        env:
          CITATION_NEEDED_CACHE: tests/fixtures/cache
        run: |
          citation-needed examples/answer.md --offline --format json > /dev/null
          ! citation-needed examples/answer.md --offline --fail-on fabricated > /dev/null
          ! citation-needed examples/numbers-answer.md --sources examples/sources --only numbers --fail-on not_found > /dev/null
          citation-needed-mcp --version
