[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "citation-needed"
version = "0.1.0.dev0"
description = "Check whether an LLM's citations are real, unretracted, and actually the paper they claim to be."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deniz Turk" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rapidfuzz>=3.6",
]
keywords = ["llm", "hallucination", "citations", "grounding", "fact-checking", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# The support judge is EXPERIMENTAL: it failed its human-agreement gate in the
# original study (Cohen's kappa 0.525). See README "What is not validated".
judge = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
citation-needed = "citation_needed.cli:main"

[project.urls]
"Original study" = "https://doi.org/10.5281/zenodo.22030231"

[tool.hatch.build.targets.wheel]
packages = ["src/citation_needed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
