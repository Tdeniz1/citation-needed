[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "citation-needed"
version = "0.1.0a1"
description = "Check whether an LLM's citations are real, unretracted, and the paper they claim to be, and whether its numbers appear in the sources."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deniz Turk" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rapidfuzz>=3.6",
]
keywords = ["llm", "hallucination", "citations", "grounding", "fact-checking", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# The support judge is EXPERIMENTAL: it failed its human-agreement gate in the
# original study (Cohen's kappa 0.525). See README "What is not validated".
judge = ["anthropic>=0.40"]
# MCP server (`citation-needed-mcp`); works with SDK 1.x and 2.x.
mcp = ["mcp>=1.2"]
# Read PDF source documents in the numbers check.
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mcp>=1.2"]

[project.scripts]
citation-needed = "citation_needed.cli:main"
citation-needed-mcp = "citation_needed.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Tdeniz1/citation-needed"
Issues = "https://github.com/Tdeniz1/citation-needed/issues"
"Original study" = "https://doi.org/10.5281/zenodo.22030231"
"Study code" = "https://github.com/Tdeniz1/Open-Weight-LLM-Medical-Citation-Audit"

[tool.hatch.build.targets.wheel]
packages = ["src/citation_needed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
